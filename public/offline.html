<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#CD7F32" />
  <title>Hors ligne — Portail SRP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #E8930A 0%, #B56A0A 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #E8930A, #B56A0A);
      border-radius: 20px;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #E8930A, #B56A0A);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity .15s;
    }
    .btn:hover { opacity: 0.9; }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #9CA3AF;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #EF4444;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <img src="/icons/icon-72x72.png" alt="SRP" width="50" height="50" style="border-radius:12px" />
    </div>
    <h1>Pas de connexion</h1>
    <p>
      Vous êtes hors ligne. Reconnectez-vous à internet pour accéder au Portail SRP.
    </p>
    <button class="btn" onclick="tryReconnect()">Réessayer</button>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Hors ligne</span>
    </div>
  </div>

  <script>
    function tryReconnect() {
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        window.location.reload();
      }
    }

    function updateStatus() {
      const dot = document.getElementById('dot');
      const text = document.getElementById('status-text');
      if (navigator.onLine) {
        dot.style.background = '#22C55E';
        text.textContent = 'Connexion rétablie — cliquez pour continuer';
      } else {
        dot.style.background = '#EF4444';
        text.textContent = 'Hors ligne';
      }
    }

    window.addEventListener('online', () => {
      updateStatus();
      setTimeout(() => window.location.href = '/', 1200);
    });
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
